{% extends "base.html" %}

{% block title %}Student Dashboard - Unified Education Interface{% endblock %}

{% block content %}
<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- Student Info Card -->
    <div class="bg-white p-6 rounded-lg shadow-lg">
        <h2 class="text-xl font-bold text-blue-600 mb-4">Student Information</h2>
        <div id="studentInfo" class="space-y-2">
            <p><span class="font-semibold">Loading...</span></p>
        </div>
    </div>

    <!-- Academic Progress -->
    <div class="bg-white p-6 rounded-lg shadow-lg">
        <h2 class="text-xl font-bold text-green-600 mb-4">Academic Progress</h2>
        <div class="w-full bg-gray-200 rounded-full h-4">
            <div id="progressBar" class="bg-green-600 h-4 rounded-full" style="width: 0%"></div>
        </div>
        <p id="progressText" class="mt-2 text-sm text-gray-600">0% Complete</p>
    </div>

    <!-- Quick Actions -->
    <div class="bg-white p-6 rounded-lg shadow-lg">
        <h2 class="text-xl font-bold text-purple-600 mb-4">Quick Actions</h2>
        <div class="space-y-3">
            <button onclick="showProjectUpload()" 
                    class="w-full bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600 transition">
                Upload Project
            </button>
            <button onclick="loadPerformance()" 
                    class="w-full bg-green-500 text-white py-2 px-4 rounded hover:bg-green-600 transition">
                View Performance
            </button>
        </div>
    </div>

    <!-- Projects Section -->
    <div class="lg:col-span-3 bg-white p-6 rounded-lg shadow-lg">
        <h2 class="text-xl font-bold text-gray-800 mb-4">My Projects</h2>
        <div id="projectsList" class="space-y-4">
            <!-- Projects will be loaded here -->
        </div>
    </div>
</div>

<!-- Project Upload Modal -->
<div id="projectModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
    <div class="bg-white p-6 rounded-lg w-96">
        <h3 class="text-lg font-bold mb-4">Upload New Project</h3>
        <form onsubmit="uploadProject(event)" class="space-y-3">
            <input type="text" id="projectTitle" placeholder="Project Title" required 
                   class="w-full px-3 py-2 border rounded">
            <textarea id="projectDescription" placeholder="Description" 
                      class="w-full px-3 py-2 border rounded"></textarea>
            <input type="text" id="projectTech" placeholder="Technology Used" 
                   class="w-full px-3 py-2 border rounded">
            <input type="url" id="projectGithub" placeholder="GitHub Link" 
                   class="w-full px-3 py-2 border rounded">
            <div class="flex space-x-3">
                <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                    Upload
                </button>
                <button type="button" onclick="hideProjectUpload()" 
                        class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">
                    Cancel
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    let token = localStorage.getItem('token');
    
    if (!token) {
        window.location.href = '/login';
    }

    // Load student data on page load
    document.addEventListener('DOMContentLoaded', function() {
        loadStudentData();
        loadProjects();
    });

    async function loadStudentData() {
        try {
            const response = await fetch('/student/performance', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();
            
            if (response.ok) {
                document.getElementById('progressBar').style.width = `${data.academic_progress}%`;
                document.getElementById('progressText').textContent = `${data.academic_progress}% Complete`;
            }
        } catch (error) {
            console.error('Error loading student data:', error);
        }
    }

    function showProjectUpload() {
        document.getElementById('projectModal').classList.remove('hidden');
    }

    function hideProjectUpload() {
        document.getElementById('projectModal').classList.add('hidden');
    }

    async function uploadProject(event) {
        event.preventDefault();
        
        const projectData = {
            title: document.getElementById('projectTitle').value,
            description: document.getElementById('projectDescription').value,
            technology: document.getElementById('projectTech').value,
            github_link: document.getElementById('projectGithub').value,
            upload_date: new Date().toISOString()
        };

        try {
            const response = await fetch('/student/upload_project', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(projectData)
            });

            if (response.ok) {
                alert('Project uploaded successfully!');
                hideProjectUpload();
                loadProjects();
            } else {
                alert('Error uploading project');
            }
        } catch (error) {
            console.error('Error:', error);
        }
    }

    async function loadProjects() {
        try {
            const response = await fetch('/student/performance', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();
            
            if (response.ok && data.projects) {
                const projectsList = document.getElementById('projectsList');
                projectsList.innerHTML = data.projects.map(project => `
                    <div class="border-l-4 border-blue-500 pl-4 py-2 bg-gray-50">
                        <h4 class="font-semibold">${project.title}</h4>
                        <p class="text-sm text-gray-600">${project.description}</p>
                        <p class="text-xs text-gray-500">Tech: ${project.technology}</p>
                        <a href="${project.github_link}" target="_blank" class="text-blue-500 text-xs">GitHub</a>
                    </div>
                `).join('');
            }
        } catch (error) {
            console.error('Error loading projects:', error);
        }
    }

    async function loadPerformance() {
        // Implementation for performance analytics
        alert('Performance analytics feature coming soon!');
    }

    function logout() {
        localStorage.removeItem('token');
        window.location.href = '/login';
    }
</script>
{% endblock %}
