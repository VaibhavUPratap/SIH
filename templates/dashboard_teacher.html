{% extends "base.html" %}

{% block title %}Teacher Dashboard - Unified Education Interface{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Teacher Info -->
        <div class="bg-white p-6 rounded-lg shadow-lg">
            <h2 class="text-xl font-bold text-blue-600 mb-4">Teacher Profile</h2>
            <div id="teacherInfo">
                <p>Loading...</p>
            </div>
        </div>

        <!-- Evaluation Stats -->
        <div class="bg-white p-6 rounded-lg shadow-lg">
            <h2 class="text-xl font-bold text-green-600 mb-4">Evaluation Statistics</h2>
            <div id="evaluationStats">
                <p>Loading...</p>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="bg-white p-6 rounded-lg shadow-lg">
            <h2 class="text-xl font-bold text-purple-600 mb-4">Quick Actions</h2>
            <div class="space-y-3">
                <button onclick="showEvaluationForm()" 
                        class="w-full bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600">
                    Evaluate Student
                </button>
                <button onclick="loadPerformance()" 
                        class="w-full bg-green-500 text-white py-2 px-4 rounded hover:bg-green-600">
                    View Performance
                </button>
            </div>
        </div>
    </div>

    <!-- Recent Evaluations -->
    <div class="bg-white p-6 rounded-lg shadow-lg">
        <h2 class="text-xl font-bold text-gray-800 mb-4">Recent Evaluations</h2>
        <div id="evaluationsList">
            <!-- Evaluations will be loaded here -->
        </div>
    </div>
</div>

<!-- Evaluation Modal -->
<div id="evaluationModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
    <div class="bg-white p-6 rounded-lg w-96">
        <h3 class="text-lg font-bold mb-4">Evaluate Student</h3>
        <form onsubmit="submitEvaluation(event)" class="space-y-3">
            <input type="text" id="studentId" placeholder="Student ID" required 
                   class="w-full px-3 py-2 border rounded">
            <textarea id="evaluationNotes" placeholder="Evaluation Notes" required
                      class="w-full px-3 py-2 border rounded"></textarea>
            <input type="number" id="evaluationScore" placeholder="Score (0-100)" min="0" max="100"
                   class="w-full px-3 py-2 border rounded">
            <input type="number" id="progressUpdate" placeholder="Progress %" min="0" max="100"
                   class="w-full px-3 py-2 border rounded">
            <div class="flex space-x-3">
                <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                    Submit
                </button>
                <button type="button" onclick="hideEvaluationForm()" 
                        class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">
                    Cancel
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    let token = localStorage.getItem('token');
    
    if (!token) {
        window.location.href = '/login';
    }

    document.addEventListener('DOMContentLoaded', function() {
        loadTeacherData();
        loadEvaluations();
    });

    async function loadTeacherData() {
        try {
            const [profileResponse, performanceResponse] = await Promise.all([
                fetch('/auth/profile', {
                    headers: { 'Authorization': `Bearer ${token}` }
                }),
                fetch('/teacher/performance', {
                    headers: { 'Authorization': `Bearer ${token}` }
                })
            ]);

            const profileData = await profileResponse.json();
            const performanceData = await performanceResponse.json();

            if (profileResponse.ok) {
                document.getElementById('teacherInfo').innerHTML = `
                    <p><strong>Name:</strong> ${profileData.name}</p>
                    <p><strong>Subject:</strong> ${profileData.subject}</p>
                    <p><strong>APAR ID:</strong> ${profileData.apar_id}</p>
                    <p><strong>Department:</strong> ${profileData.department}</p>
                `;
            }

            if (performanceResponse.ok) {
                document.getElementById('evaluationStats').innerHTML = `
                    <p><strong>Total Evaluations:</strong> ${performanceData.evaluations_count}</p>
                    <p><strong>Subject:</strong> ${performanceData.subject}</p>
                `;
            }
        } catch (error) {
            console.error('Error loading teacher data:', error);
        }
    }

    function showEvaluationForm() {
        document.getElementById('evaluationModal').classList.remove('hidden');
    }

    function hideEvaluationForm() {
        document.getElementById('evaluationModal').classList.add('hidden');
    }

    async function submitEvaluation(event) {
        event.preventDefault();
        
        const evaluationData = {
            student_id: document.getElementById('studentId').value,
            evaluation: document.getElementById('evaluationNotes').value,
            score: document.getElementById('evaluationScore').value,
            progress: document.getElementById('progressUpdate').value,
            date: new Date().toISOString(),
            update_progress: true
        };

        try {
            const response = await fetch('/teacher/evaluate_student', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(evaluationData)
            });

            if (response.ok) {
                alert('Evaluation submitted successfully!');
                hideEvaluationForm();
                loadEvaluations();
            } else {
                alert('Error submitting evaluation');
            }
        } catch (error) {
            console.error('Error:', error);
        }
    }

    async function loadEvaluations() {
        try {
            const response = await fetch('/teacher/performance', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();
            
            // Note: In a real implementation, you'd have a separate endpoint for evaluations
            document.getElementById('evaluationsList').innerHTML = `
                <p class="text-gray-600">Evaluation history will be displayed here.</p>
            `;
        } catch (error) {
            console.error('Error loading evaluations:', error);
        }
    }

    function logout() {
        localStorage.removeItem('token');
        window.location.href = '/login';
    }
</script>
{% endblock %}
