<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Form</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div id="registerForm">
        <h3>Register New Account</h3>

        <div id="message" class="hidden"></div>

        <select id="role">
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
            <option value="institution">Institution</option>
            <option value="admin">Admin</option>
        </select>
        
        <input type="text" id="reg_name" placeholder="Full Name">
        <input type="email" id="reg_email" placeholder="Email Address">
        <input type="password" id="reg_password" placeholder="Password">

        <!-- Role-specific fields -->
        <div id="studentFields" class="hidden">
            <input type="text" id="enrollment_no" placeholder="Enrollment No">
        </div>

        <div id="teacherFields" class="hidden">
            <input type="text" id="apar_id" placeholder="APAR ID">
            <input type="text" id="subject" placeholder="Subject">
        </div>

        <div id="institutionFields" class="hidden">
            <input type="text" id="aishe_code" placeholder="AISHE Code">
            <input type="text" id="institution_name" placeholder="Institution Name">
        </div>

        <button type="button" id="regis-btn">Register</button>
        <button type="button" id="cncl-btn">Cancel</button>
    </div>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
