version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://uei_user:uei_password@db:5432/uei_db
      - SECRET_KEY=change-this-in-production
      - JWT_SECRET_KEY=change-this-jwt-secret
    depends_on:
      - db
    volumes:
      - ../logs:/app/logs
      - ../uploads:/app/uploads
    networks:
      - uei-network

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=uei_user
      - POSTGRES_PASSWORD=uei_password
      - POSTGRES_DB=uei_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - uei-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - uei-network

volumes:
  postgres_data:

networks:
  uei-network:
    driver: bridge
